name: release

# Builds the pipeline package on every version tag and proves the wheel works on its own:
# installed in a clean environment, outside the repo, the offline demo must run and the
# vault it writes must pass the audit. Publishing to PyPI uses trusted publishing (OIDC),
# so no token is stored anywhere. It stays off until the repository variable
# PYPI_PUBLISH is set to "true", which is done once the PyPI side is configured
# (see CONTRIBUTING.md > Releasing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build pipeline --outdir dist
      - run: twine check --strict dist/*
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pipeline/pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package $version"; exit 1; }
      - name: The wheel works outside the repo
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/nightshift demo --out /tmp/demo-vault
          node "$GITHUB_WORKSPACE/vault/audit.mjs" --vault /tmp/demo-vault --strict
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nightshift-brain/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
